name: Run Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  NPM_TOKEN: ""

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout to master
        with:
          ref: master
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: 20
          cache: yarn
      - uses: borales/actions-yarn@v5
        name: Install dependencies
        with:
          cmd: install
      - uses: borales/actions-yarn@v5
        name: Run TypeScript check
        with:
          cmd: test:tsc
      - uses: borales/actions-yarn@v5
        name: Run unit tests
        with:
          cmd: test:unit
